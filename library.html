<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Library - Библиотека изображений</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap&subset=cyrillic" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats {
      display: flex;
      gap: 30px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-value {
      font-weight: 700;
      color: #e94560;
    }

    /* Upload Section */
    .upload-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
      border: 2px dashed rgba(233, 69, 96, 0.3);
      transition: all 0.3s ease;
    }

    .upload-section:hover,
    .upload-section.dragover {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.1);
    }

    .upload-content {
      text-align: center;
    }

    .upload-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .upload-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .upload-subtitle {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    .upload-btn {
      display: inline-block;
      padding: 14px 40px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
    }

    #fileInput {
      display: none;
    }

    /* Progress */
    .progress-container {
      margin-top: 20px;
      display: none;
    }

    .progress-container.active {
      display: block;
    }

    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      width: 0%;
      transition: width 0.3s;
    }

    .progress-text {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Gallery */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .gallery-title {
      font-size: 20px;
      font-weight: 500;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 20px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      aspect-ratio: 1;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .gallery-item:hover .overlay {
      opacity: 1;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .action-btn.copy {
      background: #e94560;
      color: #fff;
    }

    .action-btn.delete {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .action-btn:hover {
      filter: brightness(1.2);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1001;
    }

    .toast {
      padding: 16px 24px;
      background: #333;
      color: #fff;
      border-radius: 8px;
      margin-top: 10px;
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.success {
      background: #27ae60;
    }

    .toast.error {
      background: #e74c3c;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.5);
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }

      .stats {
        flex-wrap: wrap;
        justify-content: center;
      }

      .upload-section {
        padding: 30px 20px;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">📸 Image Library</div>
      <div class="stats">
        <div class="stat-item">
          <span>Изображений:</span>
          <span class="stat-value" id="totalImages">0</span>
        </div>
        <div class="stat-item">
          <span>Размер:</span>
          <span class="stat-value" id="totalSize">0 MB</span>
        </div>
      </div>
    </header>

    <section class="upload-section" id="dropZone">
      <div class="upload-content">
        <div class="upload-icon">☁️</div>
        <h2 class="upload-title">Загрузить изображения</h2>
        <p class="upload-subtitle">Перетащите файлы сюда или нажмите кнопку</p>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
          Выбрать файлы
        </button>
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/gif,image/webp">
      </div>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Загрузка...</p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="gallery-header">
        <h2 class="gallery-title">Галерея</h2>
        <button class="refresh-btn" onclick="loadImages()">🔄 Обновить</button>
      </div>
      <div class="gallery" id="gallery">
        <div class="loading">
          <div class="spinner"></div>
          <p>Загрузка изображений...</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImage" src="" alt="">
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_URL = window.location.origin;
    const gallery = document.getElementById('gallery');
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');

    // Toast notification
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'} ${message}`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Load images from API
    async function loadImages() {
      gallery.innerHTML = '<div class="loading"><div class="spinner"></div><p>Загрузка изображений...</p></div>';
      
      try {
        const response = await fetch(`${API_URL}/api/images`);
        const data = await response.json();
        
        if (data.success && data.images.length > 0) {
          renderGallery(data.images);
          updateStats(data.images);
        } else {
          gallery.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <h3>Библиотека пуста</h3>
              <p>Загрузите первое изображение!</p>
            </div>
          `;
          document.getElementById('totalImages').textContent = '0';
          document.getElementById('totalSize').textContent = '0 MB';
        }
      } catch (error) {
        console.error('Load error:', error);
        gallery.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>Ошибка загрузки</h3>
            <p>Проверьте подключение к серверу</p>
          </div>
        `;
      }
    }

    // Render gallery
    function renderGallery(images) {
      gallery.innerHTML = images.map(img => `
        <div class="gallery-item" onclick="openLightbox('${img.url}')">
          <img src="${img.url}" alt="${img.id}" loading="lazy">
          <div class="overlay">
            <div class="overlay-actions">
              <button class="action-btn copy" onclick="event.stopPropagation(); copyUrl('${img.url}')">📋 Копировать</button>
              <button class="action-btn delete" onclick="event.stopPropagation(); deleteImage('${img.id}')">🗑️ Удалить</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Update stats
    function updateStats(images) {
      document.getElementById('totalImages').textContent = images.length;
      const totalSize = images.reduce((acc, img) => acc + (img.size || 0), 0);
      document.getElementById('totalSize').textContent = (totalSize / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // Upload files
    async function uploadFiles(files) {
      if (files.length === 0) return;

      progressContainer.classList.add('active');
      progressFill.style.width = '0%';
      progressText.textContent = `Загрузка 0 из ${files.length}...`;

      const formData = new FormData();
      for (const file of files) {
        formData.append('images', file);
      }

      try {
        const response = await fetch(`${API_URL}/api/upload-multiple`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          progressFill.style.width = '100%';
          progressText.textContent = 'Готово!';
          showToast(`Загружено ${data.images.length} изображений`, 'success');
          loadImages();
        } else {
          showToast('Ошибка при загрузке', 'error');
        }
      } catch (error) {
        console.error('Upload error:', error);
        showToast('Ошибка при загрузке', 'error');
      }

      setTimeout(() => {
        progressContainer.classList.remove('active');
      }, 2000);
    }

    // Delete image
    async function deleteImage(id) {
      if (!confirm('Удалить это изображение?')) return;

      try {
        const response = await fetch(`${API_URL}/api/images/${id}`, {
          method: 'DELETE'
        });

        const data = await response.json();

        if (data.success) {
          showToast('Изображение удалено', 'success');
          loadImages();
        } else {
          showToast('Ошибка при удалении', 'error');
        }
      } catch (error) {
        console.error('Delete error:', error);
        showToast('Ошибка при удалении', 'error');
      }
    }

    // Copy URL
    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('URL скопирован!', 'success');
      }).catch(() => {
        showToast('Не удалось скопировать', 'error');
      });
    }

    // Lightbox
    function openLightbox(url) {
      lightboxImage.src = url;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    // File input change
    fileInput.addEventListener('change', (e) => {
      uploadFiles(e.target.files);
      fileInput.value = '';
    });

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      uploadFiles(files);
    });

    // Keyboard events
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });

    // Initial load
    loadImages();
  </script>
</body>
</html>
